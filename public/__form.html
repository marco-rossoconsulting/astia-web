<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>Form detection</title></head>
<body style="display:none;">
  <!--
    This file exists so Netlify's build-time form parser always detects the
    book-a-call form, whatever the page markup looks like. Keep the field
    names in sync with src/views/BookPage.astro. Users never see this page.
  -->
  <form name="book-a-call" method="POST" netlify netlify-honeypot="bot-field" action="/thank-you">
    <p style="display:none;"><label>Don't fill this out: <input name="bot-field" /></label></p>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="business" />
    <input type="text" name="website" />
    <input type="hidden" name="lang" value="en" />
  </form>
</body>
</html>
