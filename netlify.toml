[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects: www and HTTP to canonical HTTPS non-www ──
[[redirects]]
  from = "http://astiaweb.com/*"
  to = "https://astiaweb.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.astiaweb.com/*"
  to = "https://astiaweb.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.astiaweb.com/*"
  to = "https://astiaweb.com/:splat"
  status = 301
  force = true

# ── Redirects: trailing slash to no-trailing-slash ──
# (Removed: build.format: 'file' outputs .html files; Netlify Pretty URLs
# serves them without extension. Legacy trailing-slash URLs in Google's
# index will 404 and drop naturally; canonical tags prevent duplication.)

